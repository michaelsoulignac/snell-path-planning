<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>A Drone That Follows Light</title>
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/scene.css">
    </head>
    <body>
        <div class="wrap">
            <header><h1>A Drone That Follows Light</h1></header>

            <section class="panel layout" aria-label="Simulation">
                <div class="controls" aria-label="Controls">
                    <div class="control">
                        <label for="speed"><span>Drone airspeed</span><output id="speedOut"></output></label>
                        <input id="speed" type="range">
                    </div>
                </div>
                <div class="scene-area">
                    <div class="scene-scroll"><svg id="scene" role="img" aria-label="A drone crossing zones of wind from left to right"></svg></div>
                    <div class="legend">
                        <span><i class="sw-wind"></i>wind in the zone</span>
                        <span><i class="sw-heading"></i>heading (relative to the air)</span>
                        <span><i class="sw-accessible"></i>reachable region</span>
                        <span><i class="sw-path"></i>path of the drone</span>
                    </div>
                </div>
            </section>
        </div>

        <footer class="site-footer">
            <div class="site-footer-inner">
                <a href="https://github.com/michaelsoulignac/snell-path-planning" target="_blank" rel="noopener">Code on GitHub</a>
                <a href="https://michaelsoulignac.github.io/snell-path-planning/math" target="_blank" rel="noopener">Mathematical derivation</a>
            </div>
        </footer>

        <script type="module" src="js/main.js"></script>
    </body>
</html>
